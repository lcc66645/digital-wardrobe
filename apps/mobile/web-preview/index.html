<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字衣橱 App · 本机预览</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: linear-gradient(135deg, #FFF8F0 0%, #FFE4EC 100%);
        font-family: Inter, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      /* 390×844 手机外壳，仅预览承载，不属于 App 内容 */
      .phone {
        width: 390px;
        height: 844px;
        border-radius: 40px;
        background: #FFF8F0;
        box-shadow:
          0 24px 60px rgba(61, 44, 30, 0.25),
          0 0 0 10px #3D2C1E,
          0 0 0 12px #8A7565;
        overflow: hidden;
        position: relative;
        flex: none;
      }
      #root { width: 100%; height: 100%; display: flex; }
      .caption {
        position: fixed;
        bottom: 12px;
        left: 0;
        right: 0;
        text-align: center;
        color: #8A7565;
        font-size: 12px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="phone"><div id="root"></div></div>
    <div class="caption">react-native-web 本机预览 · 同一套 App 源码的浏览器渲染（非原生 APK / 演示数据为本地模拟）</div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
