name: 部署前端到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免多次部署并发冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 shared 基础包（lib 为 gitignore 产物，CI 中重新生成）
        run: npm run build --workspace @dw/shared

      - name: "构建 Web 管理后台（base 子路径 /digital-wardrobe/web/）"
        run: npm run build --workspace @dw/web-admin

      - name: "构建 App 浏览器预览（base 子路径 /digital-wardrobe/app/）"
        run: npm run build:web --workspace @dw/mobile

      - name: 组装 Pages 产物
        run: |
          mkdir -p _site/web _site/app
          cp -r apps/web-admin/dist/. _site/web/
          cp -r apps/mobile/web-preview/dist/. _site/app/
          cp .github/pages-entry/index.html _site/index.html

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
