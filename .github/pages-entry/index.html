<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数字衣橱 · 前端公网预览</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fff8f0, #ffe4ec);
        font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        padding: 24px;
      }
      .card {
        background: #fff;
        border-radius: 18px;
        padding: 28px 32px;
        box-shadow: 0 12px 40px rgba(61, 44, 30, 0.18);
        width: 340px;
      }
      h1 { color: #3d2c1e; font-size: 22px; margin: 0 0 4px; }
      p.sub { color: #8a7565; font-size: 13px; margin: 0 0 20px; }
      a {
        display: block;
        padding: 16px;
        border-radius: 12px;
        text-decoration: none;
        color: #3d2c1e;
        font-weight: 600;
        margin-bottom: 12px;
      }
      a.app { background: #ffd93d; }
      a.web { background: #ffb6c1; }
      small { color: #8a7565; font-size: 12px; line-height: 1.7; display: block; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>数字衣橱</h1>
      <p class="sub">软硬一体穿搭应用 · 前端公网预览</p>
      <a class="app" href="./app/">📱 App 浏览器预览（react-native-web）</a>
      <a class="web" href="./web/">🖥️ Web 管理后台</a>
      <small>
        GitHub Pages 仅托管静态前端，后端 NestJS 服务与数据库未在公网运行；需联后端的操作（登录、数据加载）会提示网络错误，本机启动后端后可完整使用。
      </small>
    </div>
  </body>
</html>
